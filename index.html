<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Pratheeksha 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff5c8a; --rose:#ff9eb5; --gold:#ffd27a; --cream:#fff4f7; --ink:#4a1f33;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Poppins',sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#ffe3ec 0%,#ffd1e0 40%,#ffc2d6 100%);
    background-attachment:fixed; overflow-x:hidden; min-height:100vh;
  }
  /* floating hearts layer */
  #hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .heart{position:absolute;bottom:-40px;animation:rise linear forwards;opacity:.8}
  @keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

  section{position:relative;z-index:1;padding:64px 20px;max-width:900px;margin:0 auto;text-align:center}

  /* intro overlay */
  #intro{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#ff9eb5,#d6336c 90%);color:#fff;text-align:center;padding:24px;
    transition:opacity .9s ease, visibility .9s;
  }
  #intro.hide{opacity:0;visibility:hidden}
  #intro .gift{font-size:84px;animation:bounce 1.6s infinite}
  #intro h2{font-family:'Great Vibes',cursive;font-size:44px;font-weight:400;margin:14px 0 6px}
  #intro p{opacity:.9;margin-bottom:26px}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  .btn{
    border:none;cursor:pointer;font:600 16px 'Poppins',sans-serif;padding:14px 30px;border-radius:50px;
    background:#fff;color:var(--pink);box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .2s;
  }
  .btn:hover{transform:scale(1.06)}
  .btn.pink{background:linear-gradient(135deg,#ff5c8a,#ff8fab);color:#fff}

  /* hero */
  .hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .hero .small{letter-spacing:6px;text-transform:uppercase;font-size:13px;color:#b0446b}
  .hero h1{
    font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(52px,13vw,110px);line-height:1.05;margin:12px 0;
    background:linear-gradient(90deg,#d6336c,#ff5c8a,#e8a317);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .name{font-family:'Great Vibes',cursive;font-size:clamp(40px,10vw,76px);color:#d6336c}
  .cake{font-size:70px;margin-top:10px;animation:bounce 2s infinite}
  .scroll{margin-top:30px;font-size:13px;color:#b0446b;animation:bounce 2s infinite}

  /* wish card */
  .card{
    background:rgba(255,255,255,.72);backdrop-filter:blur(8px);border-radius:28px;padding:38px 26px;
    box-shadow:0 18px 50px rgba(214,51,108,.18);
  }
  .card h2,.title{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(36px,8vw,54px);color:#d6336c;margin-bottom:18px}
  #wish{font-size:clamp(16px,2.6vw,19px);line-height:1.9;min-height:240px;text-align:left;white-space:pre-line}
  .caret{display:inline-block;width:2px;height:1.1em;background:var(--pink);vertical-align:text-bottom;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:0}}
  .sign{margin-top:18px;font-family:'Great Vibes',cursive;font-size:32px;color:#d6336c;text-align:right}

  /* gallery */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .grid figure{
    background:#fff;padding:10px 10px 38px;border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.15);
    transform:rotate(var(--r,0deg));transition:transform .3s;position:relative
  }
  .grid figure:nth-child(odd){--r:-2.5deg}
  .grid figure:nth-child(even){--r:2.5deg}
  .grid figure:hover{transform:rotate(0) scale(1.05);z-index:3}
  .grid img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 30%;border-radius:6px;display:block}
  .grid figcaption{position:absolute;bottom:9px;left:0;right:0;font-family:'Great Vibes',cursive;font-size:22px;color:#d6336c}

  /* video */
  video{width:100%;max-width:560px;border-radius:22px;box-shadow:0 16px 44px rgba(214,51,108,.3);background:#000}

  /* reasons */
  .reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px}
  .reason{background:rgba(255,255,255,.75);border-radius:20px;padding:22px 16px;box-shadow:0 8px 22px rgba(214,51,108,.12)}
  .reason span{font-size:34px;display:block;margin-bottom:8px}

  /* surprise */
  #surprise-msg{
    margin-top:26px;font-family:'Great Vibes',cursive;font-size:clamp(34px,8vw,58px);color:#d6336c;
    opacity:0;transform:scale(.8);transition:all .8s;
  }
  #surprise-msg.show{opacity:1;transform:scale(1)}

  footer{position:relative;z-index:1;text-align:center;padding:30px 20px 60px;color:#b0446b;font-size:14px}

  /* music toggle */
  #music{
    position:fixed;right:16px;bottom:16px;z-index:40;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none
  }
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

  .reveal{opacity:0;transform:translateY(30px);transition:all .9s ease}
  .reveal.in{opacity:1;transform:none}
</style>
</head>
<body>

<!-- ============ EDIT HERE ============ -->
<script>
const CONFIG = {
  name: "Pratheeksha",
  from: "Rakshith",            // <- put your name (or a pet name)
  // Photos live in the photos/ folder; edit the captions here
  photos: [
    {src:"1.jpg", caption:"My favourite smile"},
    {src:"2.jpg", caption:"Golden hour, golden you"},
    {src:"3.jpg", caption:"Sunshine and you"},
    {src:"4.jpg", caption:"Brighter than the sunflowers"},
    {src:"5.jpg", caption:"That laugh"},
    {src:"6.jpg", caption:"So beautiful"},
    {src:"7.jpg", caption:"Effortlessly lovely"},
    {src:"8.jpg", caption:"My heart in one frame"},
    {src:"9.jpg", caption:"That little smile"},
    {src:"10.jpg", caption:"Pure joy"},
    {src:"11.jpg", caption:"Lost in the view"},
    {src:"12.jpg", caption:"Always so graceful"},
    {src:"13.jpg", caption:"Cutest pose ever"},
    {src:"14.jpg", caption:"Like a sunflower"},
    {src:"15.jpg", caption:"Always smiling"},
    {src:"16.jpg", caption:"Peace and sunshine"},
    {src:"17.jpg", caption:"Stunning, always"},
    {src:"18.jpg", caption:"Forever my favourite"}
  ],
  video: "video.mp4",                // optional, delete the file to hide this section
  music: "song.mp3",                 // optional, delete the file to hide the music button
  wish:
`Happy Birthday, my love! 🎂

Today the world got the sweetest, kindest soul it has ever known, and I got the luckiest seat right next to her.

You are the kind of person who makes everyone around you feel safe, seen and loved. Your heart is pure, your smile can fix my worst day, and your kindness is something I admire more every single day.

Thank you for being you, Pratheeksha. Thank you for every laugh, every hug and every little moment that turned into my favourite memory.

May this year give you everything you give to others: love, joy, and a thousand reasons to smile. I'll always be right here, cheering for you.

I love you, today and always. 💖`,
  reasons: [
    ["🌸","You are the kindest person I know"],
    ["😊","Your smile lights up my whole world"],
    ["🤗","You make every place feel like home"],
    ["✨","You are my favourite person, always"]
  ]
};
</script>
<!-- =================================== -->

<div id="hearts"></div>
<canvas id="confetti"></canvas>

<div id="intro">
  <div class="gift">🎁</div>
  <h2>A little surprise for you…</h2>
  <p>Tap to open, ideally with sound on 🎵</p>
  <button class="btn" id="openBtn">Open 💌</button>
</div>

<button id="music" title="Music on/off">🎵</button>

<section class="hero">
  <div class="small">Happy Birthday</div>
  <h1>To the sweetest girl</h1>
  <div class="name" id="nameHero"></div>
  <div class="cake">🎂</div>
  <div class="scroll">scroll down ↓</div>
</section>

<section class="reveal">
  <div class="card">
    <h2>A wish from my heart</h2>
    <div id="wish"></div><span class="caret"></span>
    <div class="sign">- <span id="fromName"></span></div>
  </div>
</section>

<section class="reveal" id="photoSec">
  <div class="title">Our beautiful moments</div>
  <div class="grid" id="grid"></div>
</section>

<section class="reveal" id="videoSec" style="display:none">
  <div class="title">Something special for you</div>
  <video id="vid" controls playsinline preload="metadata"></video>
</section>

<section class="reveal">
  <div class="title">Why you're so special</div>
  <div class="reasons" id="reasons"></div>
</section>

<section class="reveal">
  <div class="title">One more thing…</div>
  <button class="btn pink" id="surpriseBtn">Tap for your surprise 🎉</button>
  <div id="surprise-msg"></div>
</section>

<footer>Made with 💖 just for you</footer>

<script>
const $ = s => document.querySelector(s);
$('#nameHero').textContent = CONFIG.name;
$('#fromName').textContent = CONFIG.from;
document.title = `Happy Birthday ${CONFIG.name} 🎂`;

// reasons
$('#reasons').innerHTML = CONFIG.reasons.map(r=>`<div class="reason"><span>${r[0]}</span>${r[1]}</div>`).join('');

// photos (kept in order; any that fail to load are removed)
const grid = $('#grid');
CONFIG.photos.forEach(p=>{
  const f = document.createElement('figure');
  const img = new Image();
  img.src = p.src; img.alt = p.caption; img.loading = 'lazy'; img.decoding = 'async';
  const c = document.createElement('figcaption'); c.textContent = p.caption;
  img.onerror = () => { f.remove(); if(!grid.children.length) $('#photoSec').style.display='none'; };
  f.append(img, c); grid.append(f);
});

// video (only show if file exists)
const vid = $('#vid');
vid.src = CONFIG.video;
vid.addEventListener('loadedmetadata', ()=> $('#videoSec').style.display='block');

// music
const audio = new Audio(CONFIG.music); audio.loop = true;
let audioOk = true; audio.addEventListener('error', ()=> audioOk=false);
const musicBtn = $('#music');
musicBtn.onclick = () => {
  if(audio.paused){ audio.play(); musicBtn.textContent='🎵'; } else { audio.pause(); musicBtn.textContent='🔇'; }
};

// floating hearts
const heartsEl = $('#hearts');
const emojis = ['💖','💗','💕','🌸','✨','💝'];
function spawnHeart(){
  const h = document.createElement('div');
  h.className='heart'; h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left = Math.random()*100+'vw';
  h.style.fontSize = (14+Math.random()*26)+'px';
  h.style.animationDuration = (7+Math.random()*7)+'s';
  heartsEl.append(h); setTimeout(()=>h.remove(),15000);
}
setInterval(spawnHeart, 600);

// typewriter
let typed = false;
function typeWish(){
  if(typed) return; typed = true;
  const el = $('#wish'); let i = 0; const t = CONFIG.wish;
  (function step(){ el.textContent = t.slice(0,i++); if(i<=t.length) setTimeout(step, 32); })();
}

// scroll reveal
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add('in'); if(e.target.querySelector('#wish')) typeWish(); }
}),{threshold:.25});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

// confetti
const cv = $('#confetti'), ctx = cv.getContext('2d'); let parts = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; } size(); addEventListener('resize',size);
function burst(n=160){
  const colors=['#ff5c8a','#ffd27a','#ff9eb5','#fff','#c77dff','#7ad7ff'];
  for(let i=0;i<n;i++) parts.push({
    x:innerWidth/2, y:innerHeight/2, vx:(Math.random()-.5)*16, vy:Math.random()*-16-4,
    s:5+Math.random()*7, c:colors[Math.floor(Math.random()*colors.length)], r:Math.random()*6, vr:(Math.random()-.5)*.3, life:0
  });
}
(function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
  parts = parts.filter(p=>p.y<cv.height+20 && p.life<260);
  requestAnimationFrame(loop);
})();

// open button
$('#openBtn').onclick = () => {
  $('#intro').classList.add('hide');
  burst();
  audio.play().then(()=>{ musicBtn.style.display='block'; }).catch(()=>{});
  setTimeout(()=>{ if(audioOk) musicBtn.style.display='block'; }, 400);
};

// surprise button
$('#surpriseBtn').onclick = () => {
  const m = $('#surprise-msg');
  m.textContent = `I love you, ${CONFIG.name}! 💖`;
  m.classList.add('show');
  burst(220); setTimeout(()=>burst(160),600); setTimeout(()=>burst(160),1200);
};
</script>
</body>
</html>
